[project]
name = "fastapi-init"
version = "0.1.0"
description = "Boilerplate para api usando fastapi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi-pagination>=0.12.34",
    "fastapi>=0.115.6",
    "mypy>=1.14.0",
    "pydantic[email,timezone]>=2.10.4",
    "ruff>=0.8.4",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pylint>=3.3.2",
    "isort>=5.13.2",
    "black>=24.10.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/settings/*",
    "base_model.py",
    "*/system/*",
    "*migrations*",
    "*alembic*",
    "*tests*",
    "*test_*",
    "*apps.py*",
    "*database.py*",
    "*security.py*",
    "*config.py*",
    "*admin.py*",
    "app.py",
    "rest.py",
    "__init__.py"
]
relative_files = true
source = ["src/"]
data_file = ".coverage"
branch = true

[tool.coverage.report]
fail_under = 55
show_missing = false
skip_covered = false
sort = "Cover"
precision = 2

[tool.ruff]
exclude = [".vscode", "migrations", "settings.py", ".pytest_cache", "test_*"]
preview = true
line-length = 120
target-version = "py312"  # Python 3.12

[tool.ruff.lint]
ignore = ["E402"]  # Ignorar erros de import fora do topo do arquivo
select = ["I", "F", "E", "W", "PT"]  # Escolher regras específicas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:warnings"]
asyncio_mode = "auto"
env = { PYTEST_RUNNING = "1" }

[tool.mypy]
python_version = "3.12"
incremental = true
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_reexport = false
show_error_context = true
strict_optional = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
allow_untyped_calls = true
disable_error_code = ["var-annotated", "has-type"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pylint.master]
ignore = ".vscode, migrations, settings.py, .pytest_cache"
persistent = true
cache-size = 500

[tool.pylint.messages_control]
disable = [
    "W0613", "C0114", "C0415", "E0015", "C0116", "C0115", "W1401", "E1121",
    "C0103", "E1101", "W0212", "C0301", "E0402", "W0401", "W0614", "E1137",
    "E1136", "W0621", "W0718", "R0917", "W0511", "E1102", "E1120", "E0213",
    "E0606", "W1508", "W2301", "W0719"
]

[tool.pylint.reports]
output-format = "colorized"
include-ids = true
files-output = false
reports = true
evaluation = "10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10)"
comment = true

[tool.pylint.variables]
init-import = false
dummy-variables-rgx = "_"
additional-builtins = ""

[tool.pylint.typecheck]
ignore-mixin-members = true
zope = false
acquired-members = "REQUEST,acl_users,aq_parent"

[tool.pylint.basic]
required-attributes = ""
no-docstring-rgx = "__.*__"
module-rgx = "(([a-z_][a-z0-9_]*)|([A-Z][a-zA-Z0-9]+))$"
const-rgx = "(([A-Z_][A-Z1-9_]*)|(__.*__))$"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
function-rgx = "[a-z_][a-z0-9_]{2,60}$"
method-rgx = "[a-z_][a-z0-9_]{2,60}$"
attr-rgx = "[a-z_][a-z0-9_]{2,30}$"
argument-rgx = "[a-z_][a-z0-9_]{2,30}$"
variable-rgx = "[a-z_][a-z0-9_]{2,30}$"
inlinevar-rgx = "[A-Za-z_][A-Za-z0-9_]*$"
good-names = "i,j,k,ex,Run,_"
bad-names = "foo,bar,baz,toto,tutu,tata,temp,tmp"
bad-functions = "apply,input,exec"

[tool.pylint.design]
max-args = 10
max-locals = 30
max-returns = 12
max-branchs = 15
max-statements = 60
max-parents = 20
max-attributes = 25
min-public-methods = 0
max-public-methods = 25

[tool.pylint.imports]
deprecated-modules = "regsub,string,TERMIOS,Bastion,rexec"
import-graph = ""
ext-import-graph = ""
int-import-graph = ""

[tool.pylint.classes]
exclude-protected = "_asdict,_fields,_replace,_source,_make"
ignore-iface-methods = "isImplementedBy,deferred,extends,names,namesAndDescriptions,queryDescriptionFor,getBases,getDescriptionFor,getDoc,getName,getTaggedValue,getTaggedValueTags,isEqualOrExtendedBy,setTaggedValue,isImplementedByInstancesOf,adaptWith,is_implemented_by"
defining-attr-methods = "__init__,__new__,setUp"

[tool.pylint.similarities]
min-similarity-lines = 10
ignore-comments = true
ignore-docstrings = true

[tool.pylint.miscellaneous]
notes = "FIXME,XXX,TODO,HACK,OPTIMIZE,NOTE"

[tool.pylint.format]
max-line-length = 120
max-module-lines = 500
indent-string = "    "
